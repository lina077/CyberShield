# CyberShield firewall config (Week 3)
# Edit this file, then press R in the simulation to reload it.

# R3: maximum packet size (bytes)
maxSize = 1500

# R4: allowed packets per window per source, window length, strikes before auto-ban, ban time
rateLimitN = 5
windowSec = 1.0
banStrikes = 6
banSeconds = 10

# R6: failed logins allowed before blocking
maxFailedLogins = 3

# R1: blacklisted source IPs (comma separated)
blacklist = 66.66.66.66

# R2: risky destination ports
ports = 23, 445, 3389

# R5: known malware signatures
signatures = MALWARE-X1, TROJAN-77, EVIL-PAYLOAD

# Start-up state of each rule (on / off)
R1 = on
R2 = on
R3 = on
R4 = on
R5 = on
R6 = on